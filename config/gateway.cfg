# Acceptor (the gateway). One [SESSION] per client that's allowed to log on.
[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
SenderCompID=GATEWAY
SocketAcceptPort=9878
SocketReuseAddress=Y
SocketNodelay=Y
# 24h sessions; sequence numbers only reset when both sides agree to
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
# sequence numbers and sent messages on disk, so a restart resumes the session
FileStorePath=store/gateway
FileLogPath=log/gateway
UseDataDictionary=Y
DataDictionary=config/spec/FIX44.xml
ValidateUserDefinedFields=N
AllowUnknownMsgFields=Y
TimeStampPrecision=6

[SESSION]
TargetCompID=CLIENT1

[SESSION]
TargetCompID=CLIENT2

[SESSION]
TargetCompID=BENCH

# the Python algo framework (algo-execution's FixExchange): the algo and the
# liquidity it replays from market data. Fresh numbering every run.
[SESSION]
TargetCompID=ALGO
ResetOnLogon=Y

[SESSION]
TargetCompID=LP
ResetOnLogon=Y
